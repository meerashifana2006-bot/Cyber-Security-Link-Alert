<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      padding: 40px;
      text-align: center;
    }
    h2 {
      color: #333;
    }
    input[type="password"] {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      margin-top: 20px;
      background-color: #00796b;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    #strength {
      font-weight: bold;
      margin-top: 15px;
      padding: 10px;
      width: 300px;
      border-radius: 5px;
      display: none;
    }
    #rules {
      margin-top: 15px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .rule {
      font-size: 14px;
      color: red;
    }
    .rule.valid {
      color: green;
    }
    #msg {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Reset Your Password</h2>
  <input type="password" id="pass" placeholder="Enter new password..." onkeyup="checkStrength()" />
  <div id="strength"></div>

  <div id="rules">
    <p class="rule" id="length">✗ At least 8 characters</p>
    <p class="rule" id="number">✗ At least 1 number (0-9)</p>
    <p class="rule" id="uppercase">✗ At least 1 uppercase letter (A-Z)</p>
    <p class="rule" id="special">✗ At least 1 special character (@, #, $, %, etc.)</p>
  </div>

  <button onclick="resetPassword()">Reset Password</button>
  <p id="msg"></p>

  <script>
    let strength = 0;

    function checkStrength() {
      const pass = document.getElementById("pass").value;
      const strengthBox = document.getElementById("strength");
      strength = 0;

      // Rules
      const lengthRule = pass.length >= 8;
      const numberRule = /[0-9]/.test(pass);
      const upperRule = /[A-Z]/.test(pass);
      const specialRule = /[@#$%^&*!]/.test(pass);

      // Update rules
      document.getElementById("length").classList.toggle("valid", lengthRule);
      document.getElementById("length").innerHTML = (lengthRule ? "✓" : "✗") + " At least 8 characters";

      document.getElementById("number").classList.toggle("valid", numberRule);
      document.getElementById("number").innerHTML = (numberRule ? "✓" : "✗") + " At least 1 number (0-9)";

      document.getElementById("uppercase").classList.toggle("valid", upperRule);
      document.getElementById("uppercase").innerHTML = (upperRule ? "✓" : "✗") + " At least 1 uppercase letter (A-Z)";

      document.getElementById("special").classList.toggle("valid", specialRule);
      document.getElementById("special").innerHTML = (specialRule ? "✓" : "✗") + " At least 1 special character (@, #, $, %, etc.)";

      // Calculate strength
      if (lengthRule) strength++;
      if (numberRule) strength++;
      if (upperRule) strength++;
      if (specialRule) strength++;

      strengthBox.style.display = "block";
      if (strength <= 1) {
        strengthBox.textContent = "Strength: Weak";
        strengthBox.style.backgroundColor = "#f8d7da";
        strengthBox.style.color = "#842029";
      } else if (strength === 2 || strength === 3) {
        strengthBox.textContent = "Strength: Medium";
        strengthBox.style.backgroundColor = "#fff3cd";
        strengthBox.style.color = "#664d03";
      } else if (strength === 4) {
        strengthBox.textContent = "Strength: Strong";
        strengthBox.style.backgroundColor = "#d1e7dd";
        strengthBox.style.color = "#0f5132";
      }
    }

    function resetPassword() {
      const pwd = document.getElementById("pass").value;
      const msg = document.getElementById("msg");

      if (strength < 4) {
        msg.style.color = "red";
        msg.innerText = "❌ Password not strong enough. Please follow all rules.";
        return;
      }

      localStorage.setItem("password", pwd);
      msg.style.color = "green";
      msg.innerText = "✅ Password reset successfully!";
      setTimeout(() => window.location.href = "login.html", 1500);
    }
  </script>
</body>
</html>
