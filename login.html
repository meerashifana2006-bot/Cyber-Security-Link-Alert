<!DOCTYPE html>
<html>
<head>
  <title>Login - Cyber Security</title>
  <style>
    body {
      font-family: Arial;
      background: url('cyber-bg.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 20px #00000066;
      width: 300px;
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      border-radius: 5px;
      border: 1px solid #999;
    }
    button {
      background: #00796b;
      color: white;
      font-weight: bold;
    }
    .error {
      color: red;
    }
    @media screen and (max-width: 600px) {
  body {
    padding: 10px;
  }

  .box, .login-box, .card, table {
    width: 100% !important;
    box-sizing: border-box;
    padding: 15px;
  }

  input, button {
    font-size: 16px;
  }
  table th, table td {
    font-size: 14px;
    padding: 8px;
  }

  h2, h3 {
    font-size: 20px;
  }
}
    
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login to Cyber Security</h2>
    <input type="email" id="email" placeholder="Enter Email">
    <input type="password" id="password" placeholder="Enter Password">
    <button onclick="login()">Login</button>
    <p><a href="forgot-password.html">Forgot Password?</a></p>
    <div id="error" class="error"></div>
  </div>

  <script>
    function validateEmail(email) {
      const regex = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
      return regex.test(email);
    }
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");
      const correctEmail = "public@user.com";
      const correctPassword = localStorage.getItem("password")||"12345";

      if (!validateEmail(email)) {
        error.textContent = "Invalid email format";
        return;
      }
      if (email === correctEmail && password === correctPassword) {
        localStorage.setItem("email", email);
        localStorage.setItem("email", email);
        window.location.href = "OTP.html";
      } else {
        error.textContent = "Incorrect email or password";
      }
    }
  </script>
</body>
</html>
