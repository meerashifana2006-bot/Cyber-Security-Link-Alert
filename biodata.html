<!DOCTYPE html>
<html>
<head>
  <title>User Biodata</title>
  <style>
    body { font-family: Arial; background: #e3f2fd; padding: 30px; }
    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 0 10px #ccc;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #1976d2;
      color: white;
    }
    @media screen and (max-width: 600px) {
  body {
    padding: 10px;
  }

  .box, .login-box, .card, table {
    width: 100% !important;
    box-sizing: border-box;
    padding: 15px;
  }

  input, button {
    font-size: 16px;
  }

  table th, table td {
    font-size: 14px;
    padding: 8px;
  }

  h2, h3 {
    font-size: 20px;
  }
}
  </style>
</head>
<body>
  <h2>User Submitted Links</h2>
  <table>
    <thead>
      <tr><th>Email</th><th>Link</th><th>Status</th></tr>
    </thead>
    <tbody id="biodataTable"></tbody>
  </table>

  <script>
    window.onload = function () {
      let email = localStorage.getItem("email") || "Unknown User";
      let data = JSON.parse(localStorage.getItem("scanHistory") || "[]");

      let table = document.getElementById("biodataTable");
      table.innerHTML = "";
      data.forEach(entry => {
        let row = `<tr><td>${email}</td><td>${entry.link}</td><td>${entry.status}</td></tr>`;
        table.innerHTML += row;
      });
    }
  </script>
</body>
</html>
